  <path d="M672,448 L752,452 L832,446 L912,450 L992,448 L1072,450 L1152,448 L1232,448 L1232,552 L672,552 Z" fill="url(#chartBlue)"/>
  <polyline points="672,448 752,452 832,446 912,450 992,448 1072,450 1152,448 1232,448" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <g fill="#f0f3f6">
    <circle cx="672" cy="448" r="4"/><circle cx="752" cy="452" r="4"/><circle cx="832" cy="446" r="4"/><circle cx="912" cy="450" r="4"/><circle cx="992" cy="448" r="4"/><circle cx="1072" cy="450" r="4"/><circle cx="1152" cy="448" r="4"/><circle cx="1232" cy="448" r="4"/>
  </g>
  <line x1="672" y1="516" x2="1232" y2="516" stroke="#d29922" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1184" y="510" font-size="12" fill="#d29922">target</text>
  <rect x="672" y="568" width="120" height="36" rx="10" fill="none" stroke="#2a3340"/>
  <text x="732" y="591" text-anchor="middle" font-size="14" fill="#c9d1d9">Check now</text>
  <rect x="804" y="568" width="110" height="36" rx="10" fill="none" stroke="#2a3340"/>
  <text x="859" y="591" text-anchor="middle" font-size="14" fill="#c9d1d9">Log price</text>
  <text x="672" y="636" font-size="12" fill="#8b949e">Updated just now</text>

  <!-- Footer -->
  <text x="24" y="742" font-size="13" fill="#8b949e">Made with VN signature</text>
  <rect x="976" y="722" width="280" height="36" rx="10" fill="none" stroke="#d29922"/>
  <text x="1116" y="745" text-anchor="middle" font-size="13" letter-spacing="1" fill="#d29922">MOCKUP — generated preview</text>
</svg>
