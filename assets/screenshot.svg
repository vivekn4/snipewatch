  <text x="928" y="152" font-size="11" letter-spacing="1.5" fill="#8b949e">TARGET PRICE ($)</text>
  <rect x="48" y="160" width="228" height="40" rx="10" fill="#0b0e14" stroke="#2a3340"/>
  <rect x="300" y="160" width="604" height="40" rx="10" fill="#0b0e14" stroke="#2a3340"/>
  <rect x="928" y="160" width="160" height="40" rx="10" fill="#0b0e14" stroke="#2a3340"/>
  <rect x="1112" y="160" width="120" height="40" rx="10" fill="#2ea043"/>
  <text x="1172" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Track it</text>

  <!-- Watchlist heading -->
  <text x="24" y="258" font-size="22" font-weight="700" fill="#f0f3f6">Watchlist&#160; [2]</text>

  <!-- Card 1 -->
