  <rect x="500" y="298" width="108" height="24" rx="6" fill="#0b0e14" stroke="#2a3340"/>
  <text x="554" y="315" text-anchor="middle" font-size="12" fill="#8b949e">bestbuy.com</text>
  <text x="48" y="362" font-size="42" font-weight="800" fill="#3fb950">$228.0</text>
  <rect x="196" y="336" width="212" height="28" rx="14" fill="#3fb950" opacity="0.18"/>
  <text x="302" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">v $71.99 below target</text>
  <text x="48" y="388" font-size="13" fill="#8b949e">Target: $299.99</text>
  <!-- chart -->
