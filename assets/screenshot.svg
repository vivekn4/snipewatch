<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="chartGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chartBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.05"/>
