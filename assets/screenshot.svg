  <text x="74" y="36" font-size="34" font-weight="800" fill="#f0f3f6">SnipeWatch</text>
  <text x="76" y="58" font-size="14" fill="#8b949e">Never overpay again.</text>
  <rect x="1052" y="20" width="204" height="36" rx="18" fill="#2ea043"/>
  <text x="1154" y="43" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Check all prices</text>

